<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>



    <title>Document</title>
</head>

<body>
    <header class="flex items-center justify-between p-6">



        <h1 class="text-2xl font-bold">
            FlowBoard
        </h1>
        <nav class="flex items-center gap-4">
            <a href="#">Board</a>
            <a href="#">Tasks</a>
            <a href="#">Team</a>
        </nav>
    </header>
    <main>
        <div>
            <div class="board-header flex flex-col gap-6 mb-8">
                <div class="board-title">
                    <h2 class="text-2xl font-bold text-gray-800">
                        My board
                    </h2>
                    <p class="text-sm text-gray-500 mt-2">
                        Manage your tasks with a simple Kanban board.
                    </p>
                </div>
                <div class="board-actions flex flex-wrap items-center gap-4">
                    <input type="search" id="serchboad" placeholder="Search tasks..."
                        class="border border-gray-300 rounded-lg px-4 py-2">
                    <select id="priorityFilter" class="border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">All priorities</option>
                        <option value="high">high</option>
                        <option value="medium">medium</option>
                        <option value="low">low</option>
                    </select>
                    <select id="assigneesFiltre" class="border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">All assignees</option>
                    </select>
                    <button type="button" id="nouvecart" class="bg-blue-300 text-white px-4 py-2 rounded-lg ">
                        + Nouvelle carte
                    </button>


                </div>
            </div>
            <div id="loading" class="flex justify-center gap-2 p-8">
                <span class="w-3 h-3 bg-blue-600 rounded-full animate-bounce"></span>
                <span class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:150ms]"></span>
                <span class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:300ms]"></span>
            </div>
            <div id="error" class="hidden text-center p-6">
                <p class="text-red-500 mb-3">
                    Impossible de charger les cartes.
                </p>
                <button id="retry" class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                    Réessayer
                </button>
            </div>

            <div id="kanban-board" class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div class="board-afaire      bg-blue-100 p-5 rounded-xl border ">
                    <h3>A faire</h3>
                    <span id="todoCount">0</span>
                    <div id="todoCards"></div>

                </div>
                <div class="board-encour      bg-amber-100 p-5 rounded-xl border ">
                    <h3>En cours</h3>
                    <span id="encoursCount">0</span>
                    <div id="progressCards"></div>


                </div>
                <div class="board-terminer    bg-green-100 p-5 rounded-xl border ">
                    <h3>Termine</h3>
                    <span id="terminerCount">0</span>
                    
                    <div id="doneCards"></div>

                </div>

            </div>
            <div id="modalCard"
                class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 overflow-y-auto">
                <form id="formCard" class="bg-white p-6 rounded-xl w-full max-w-md">



                    <h3 class="text-xl font-bold mb-4">Nouvelle carte</h3>
                    <label for="inputTetre" class="block mb-1 font-medium"> Title</label>

                    <input type="text" placeholder="enter le text" id="inputTetre"
                        class="w-full border rounded-lg p-2 mb-1">
                    <span id="titleError" class="text-red-500 text-sm"></span>

                    <label for="description" class="block mt-3 mb-1 font-medium">
                        Description
                    </label>

                    <textarea id="description" placeholder="Description"
                        class="w-full border rounded-lg p-2 mt-3 mb-1"></textarea>
                    <span id="descError" class="text-red-500 text-sm"></span>
                    <label for="tags" class="block mt-3 mb-1 font-medium">
                        Tags
                    </label>

                    <input type="text" id="tags" placeholder="Ex: frontend, api, design"
                        class="w-full border rounded-lg p-2">

                    <span id="tagsError" class="text-red-500 text-sm"></span>
                    <label for="priority" class="block mt-3 mb-1 font-medium">
                        Priority
                    </label>
                    <select id="priority" class="w-full border rounded-lg p-2 mt-3">
                        <option value="">Choisir priorité</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <span id="prioritError" class="text-red-500 text-sm"></span>
                    <label for="assignee" class="block mt-3 mb-1 font-medium">
                        Assignee
                    </label>
                    <input type="text" id="assignee" placeholder="Assignee" class="w-full border rounded-lg p-2 mt-3">
                    <span id="assenError" class="text-red-500 text-sm"></span>
                    <label for="status" class="block mt-3 mb-1 font-medium">
                        Status
                    </label>
                    <select id="status" class="w-full border rounded-lg p-2 mt-3">
                        <option value="">Choisir statut</option>
                        <option value="todo">A faire</option>
                        <option value="in-progress">En cours</option>
                        <option value="done">Terminé</option>
                    </select>
                    <span id="statError" class="text-red-500 text-sm"></span>
                    <label for="dueDate" class="block mt-3 mb-1 font-medium">
                        Due Date
                    </label>
                    <input type="date" id="dueDate" class="w-full border rounded-lg p-2 mt-3">


                    <span id="dateError" class="text-red-500 text-sm"></span>
                    <div class="flex gap-3 mt-4">
                        <button id="submitter" type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg">Ajouter</button>
                        <button type="button" id="closeModal" class="bg-gray-200 px-4 py-2 rounded-lg">Annuler</button>
                    </div>


                </form>
            </div>



        </div>
    </main>
    <script type="module" src="js/ui.js"></script>


</body>

</html>
